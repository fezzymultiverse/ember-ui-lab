name: Build Ember APK
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASS: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: android-actions/setup-android@v3
        with: {packages: ''}
      - name: Install Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Web deps
        run: npm install
      - name: Add Android project
        run: |
          if [ ! -d android ]; then npx cap add android; fi
      - name: Apply Ember native patch (Kotlin, manifest, NewPipe, signing)
        run: python3 scripts/apply_android_patch.py android android_patch
      - name: Sync web assets
        run: npx cap sync android
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
      - name: Build signed release APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: signed-app
          path: android/app/build/outputs/apk/release/*.apk
